[project]
name = "tiny-inference"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.2",
    "huggingface-hub>=2.2.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
