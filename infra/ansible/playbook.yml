---
- name: Initialize Ubuntu servers
  hosts: all
  become: true
  # if you don't set this explicitly, gather_facts will run which is a problem for tailscale connection
  # We are installing tailscale using cloud-init using terraform.
  # if set to true gather_facts can't run b/c tailscale is not setup yet
  gather_facts: false

  vars:
    app_name: tiny-inference
    app_user: tiny-inference
    app_group: tiny-inference
    app_dir: /opt/tiny-inference
    app_env_file: /etc/tiny-inference.env
    model_cache_dir: /var/lib/tiny-inference/huggingface
    deploy_public_key_path: "{{ lookup('env', 'HOME') }}/.ssh/tiny-inference.pub"

  # <tailscale and ssh readiness check
  pre_tasks:
    - name: Wait for the server to become reachable through Tailscale
      block:
        - name: Probe the server through Tailscale
          ansible.builtin.command:
            argv:
              - tailscale
              - ping
              - --c=1
              - --timeout=3s
              - "{{ ansible_host | default(inventory_hostname) }}"
          delegate_to: localhost
          become: false
          register: tailscale_ping
          changed_when: false
          until: tailscale_ping.rc == 0
          retries: 60
          delay: 2

      rescue:
        - name: Report Tailscale bootstrap failure
          ansible.builtin.fail:
            msg: >-
              {{ ansible_host | default(inventory_hostname) }} did not become
              reachable through Tailscale within five minutes. Cloud-init may
              still be running or Tailscale installation may have failed.
              Open the Hetzner console and check `cloud-init status --long`
              and `/var/log/cloud-init-output.log` on the server.

    - name: Wait for SSH over Tailscale
      block:
        - name: Probe the SSH connection
          ansible.builtin.wait_for_connection:
            delay: 5
            sleep: 5
            timeout: 300

      rescue:
        - name: Report SSH readiness failure
          ansible.builtin.fail:
            msg: >-
              {{ ansible_host | default(inventory_hostname) }} is reachable
              through Tailscale, but SSH did not become ready within five
              minutes. Check the SSH service and cloud-init logs from the
              Hetzner console.

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        argv:
          - cloud-init
          - status
          - --wait
      changed_when: false
  # </>

  tasks:
    - name: Update APT cache and upgrade installed packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install Python and uv prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - python3
          - sudo
        state: latest

    - name: Install uv
      ansible.builtin.shell:
        cmd: curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh
        executable: /bin/bash
        creates: /usr/local/bin/uv

    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: true

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        groups:
          - systemd-journal
        append: true
        home: "/home/{{ app_user }}"
        shell: /bin/bash
        system: true
        create_home: true

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ app_dir }}"
          mode: "0755"
        - path: "{{ model_cache_dir }}"
          mode: "0750"
        - path: "/home/{{ app_user }}/.ssh"
          mode: "0700"

    - name: Authorize application user SSH key
      ansible.builtin.copy:
        content: "{{ lookup('file', deploy_public_key_path) | trim }}\n"
        dest: "/home/{{ app_user }}/.ssh/authorized_keys"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0600"

    - name: Configure application environment
      ansible.builtin.copy:
        dest: "{{ app_env_file }}"
        owner: root
        group: "{{ app_group }}"
        mode: "0640"
        content: |
          HF_HOME={{ model_cache_dir }}
          MODEL_ID=HuggingFaceTB/SmolLM-135M
          MODEL_REVISION=1d461723eec654e65efdc40cf49301c89c0c92f4
          PYTHONUNBUFFERED=1

    - name: Allow application service management
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ app_name }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: |
          {{ app_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl restart {{ app_name }}.service
          {{ app_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl status {{ app_name }}.service
          {{ app_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl is-active {{ app_name }}.service

    - name: Install application systemd service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ app_name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Tiny Inference API
          Wants=network-online.target
          After=network-online.target
          ConditionPathExists={{ app_dir }}/src/main.py
          ConditionPathExists={{ app_dir }}/.venv/bin/uvicorn

          [Service]
          Type=simple
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ app_dir }}
          EnvironmentFile={{ app_env_file }}
          ExecStart={{ app_dir }}/.venv/bin/uvicorn src.main:app --host 0.0.0.0 --port 8000
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true
          ProtectSystem=full
          UMask=0027

          [Install]
          WantedBy=multi-user.target

    - name: Enable application service
      ansible.builtin.systemd_service:
        name: "{{ app_name }}.service"
        enabled: true
        daemon_reload: true
